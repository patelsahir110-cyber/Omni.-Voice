name: Build OmniVoice APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk OmniVoice.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OmniVoice-APK
          path: OmniVoice.apk

      # One-tap download page: repository -> Releases -> OmniVoice.apk
      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: OmniVoice APK build ${{ github.run_number }}
          files: OmniVoice.apk
